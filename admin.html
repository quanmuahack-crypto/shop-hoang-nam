<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Hoàng Nam — Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f3f3;color:#202020}.top{background:#171717;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1400px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat,.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000d}.stat b{display:block;font-size:28px;margin-top:8px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tabs button,.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#e5e5e5}.tabs button.active,.dark{background:#222;color:#fff}.panel{display:none}.panel.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left}.login{max-width:430px;margin:100px auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 45px #0002}.login input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px}.login button{width:100%;padding:14px;background:#222;color:#fff;border:0;border-radius:10px;font-weight:900}.approve{background:#d9f5df;color:#166534}.reject{background:#fee2e2;color:#991b1b}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');
function getUsers(){return JSON.parse(localStorage.getItem('hn_users')||'[]')}function getDeposits(){return JSON.parse(localStorage.getItem('hn_deposits')||'[]')}
function login(){if(u.value&&p.value){localStorage.setItem('hn_admin','1');render()}else alert('Nhập tài khoản và mật khẩu.')}
function logout(){localStorage.removeItem('hn_admin');location.reload()}
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}
function approve(id){const ds=getDeposits();const d=ds.find(x=>x.id===id);if(!d||d.status!=='pending')return;d.status='approved';let users=getUsers();let u=users.find(x=>x.username===d.user);if(u){u.balance=(u.balance||0)+d.amount;u.totalDeposit=(u.totalDeposit||0)+d.amount;localStorage.setItem('hn_users',JSON.stringify(users));let cur=JSON.parse(localStorage.getItem('hn_current')||'null');if(cur&&cur.username===u.username)localStorage.setItem('hn_current',JSON.stringify(u))}localStorage.setItem('hn_deposits',JSON.stringify(ds));render()}
function reject(id){const ds=getDeposits();const d=ds.find(x=>x.id===id);if(d)d.status='rejected';localStorage.setItem('hn_deposits',JSON.stringify(ds));render()}
function render(){if(!localStorage.getItem('hn_admin')){root.innerHTML='<div class="login"><h2>🔐 Shop Hoàng Nam Admin</h2><p>Trang quản trị riêng của Shop Hoàng Nam.</p><input id="u" placeholder="Tài khoản Admin"><input id="p" type="password" placeholder="Mật khẩu"><button onclick="login()">ĐĂNG NHẬP</button></div>';return}const users=getUsers(),deps=getDeposits(),pending=deps.filter(x=>x.status==='pending'),revenue=users.reduce((a,x)=>a+(x.totalDeposit||0),0);root.innerHTML='<header class="top"><h2>🛠️ Shop Hoàng Nam — Admin</h2><button class="btn" onclick="logout()">Đăng xuất</button></header><main class="wrap"><div class="stats"><div class="stat">👥 Khách hàng<b>'+users.length+'</b></div><div class="stat">📦 Đơn hàng<b>0</b></div><div class="stat">💳 Nạp chờ duyệt<b>'+pending.length+'</b></div><div class="stat">💰 Doanh thu<b>'+revenue.toLocaleString('vi-VN')+' đ</b></div></div><div class="tabs"><button class="active" onclick="tab(\'users\',this)">👥 Khách hàng</button><button onclick="tab(\'orders\',this)">📦 Đơn hàng</button><button onclick="tab(\'payments\',this)">💳 Nạp tiền</button><button onclick="tab(\'services\',this)">🎮 Dịch vụ</button></div><section id="users" class="panel active"><h2>Quản lý khách hàng</h2><table class="table"><tr><th>Tài khoản</th><th>Email</th><th>Số dư</th><th>Tổng nạp</th></tr>'+users.map(x=>'<tr><td>'+x.username+'</td><td>'+x.email+'</td><td>'+Number(x.balance||0).toLocaleString('vi-VN')+' đ</td><td>'+Number(x.totalDeposit||0).toLocaleString('vi-VN')+' đ</td></tr>').join('')+'</table></section><section id="orders" class="panel"><h2>Quản lý đơn hàng</h2><p>Chức năng đơn hàng sẽ là bước tiếp theo.</p></section><section id="payments" class="panel"><h2>Duyệt nạp tiền</h2><table class="table"><tr><th>Khách</th><th>Loại</th><th>Mệnh giá</th><th>Trạng thái</th><th>Thao tác</th></tr>'+deps.map(d=>'<tr><td>'+d.user+'</td><td>'+d.type+'</td><td>'+Number(d.amount).toLocaleString('vi-VN')+' đ</td><td>'+d.status+'</td><td>'+(d.status==='pending'?'<button class="btn approve" onclick="approve('+d.id+')">Duyệt</button> <button class="btn reject" onclick="reject('+d.id+')">Từ chối</button>':'Đã xử lý')+'</td></tr>').join('')+'</table></section><section id="services" class="panel"><h2>Quản lý dịch vụ</h2><p>Shop hiện có các danh mục dịch vụ từ giao diện khách hàng. Bước sau có thể thêm chức năng chỉnh giá trực tiếp.</p></section></main>'}
render();
</script></body></html>
