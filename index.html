<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Hoàng Nam</title><style>
html{background:#f4f4f4;color:#1b1b1b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#1b1b1b}.top{position:sticky;top:0;z-index:20;background:#171717;padding:15px 4%;display:flex;align-items:center;gap:12px;box-shadow:0 3px 18px #0004;flex-wrap:wrap}.logo{font-size:23px;font-weight:900;margin-right:auto;color:#fff}.top button,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.dark{background:#333;color:#fff}.light,.top a{background:#e6e6e6;color:#1b1b1b!important}.wrap{max-width:1250px;margin:auto;padding:25px 18px}.balance,.section,.card,.top-card{background:#fff;border:1px solid #d5d5d5;border-radius:16px;box-shadow:0 5px 20px #00000010}.balance{padding:16px 20px;margin:15px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.money{font-size:24px;font-weight:900;color:#333}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.top-card{padding:20px}.card h3{min-height:48px}.status{display:inline-block;background:#e6e6e6;color:#333;border-radius:20px;padding:6px 11px;font-weight:800;margin-bottom:12px}.full{width:100%}.section{padding:22px;margin-top:22px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #bbb;border-radius:10px;background:#fafafa;color:#1b1b1b}.top5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.top-card{text-align:center}.rank{font-size:28px;font-weight:900}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #ccc;border-radius:18px;padding:25px}.close{float:right;border:0;border-radius:8px;padding:7px;cursor:pointer;background:#ddd;color:#111}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.top5{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.top5{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="logo">Shop Hoàng Nam</div><button onclick="scrollTo({top:0,behavior:'smooth'})">⌂ Trang chủ</button><button onclick="document.getElementById('services').scrollIntoView()">🎮 Dịch vụ</button><button onclick="document.getElementById('deposit').scrollIntoView()">💳 Nạp tiền</button><button id="authBtn" class="dark" onclick="openAuth()">Đăng nhập</button></header>
<main class="wrap"><div class="balance"><div>👤 <span id="who">Chưa đăng nhập</span></div><div>Số dư: <span id="balance" class="money">0 đ</span></div></div>
<section class="section"><h2>🏆 TOP NẠP TIỀN</h2><p>Top 5 người có tổng tiền nạp cao nhất.</p><div class="top5"><div class="top-card">🏆<br><b>Chưa có dữ liệu</b></div></div></section>
<section id="deposit" class="section"><h2>💳 Nạp tiền</h2><p>Hệ thống nạp tiền của Shop Hoàng Nam.</p><div class="field"><label>Nhà mạng / loại thẻ</label><select><option>Viettel</option><option>Mobifone</option><option>Vinaphone</option><option>Garena</option></select></div><div class="field"><label>Seri thẻ</label><input></div><div class="field"><label>Mã thẻ</label><input></div><div class="field"><label>Mệnh giá</label><select><option>50.000 đ</option><option>100.000 đ</option><option>200.000 đ</option><option>500.000 đ</option><option>1.000.000 đ</option></select></div><button class="btn dark full">GỬI YÊU CẦU NẠP</button></section>
<section id="services"><h2>Dịch vụ cày thuê</h2><div class="grid" id="serviceGrid"></div></section>
<section class="section"><h2>📞 Liên hệ</h2><p>Shop Hoàng Nam — hỗ trợ khách hàng.</p></section></main>
<div id="authModal" class="modal"><div class="box"><button class="close" onclick="closeAuth()">✕</button><h2>Đăng nhập</h2><div class="field"><label>Tên tài khoản</label><input></div><div class="field"><label>Mật khẩu</label><input type="password"></div><button class="btn dark full">ĐĂNG NHẬP</button></div></div>
<script>
const catalog={'Leviathan':['Đi nhanh 10 Tìm Leviathan - 99 Vảy','Lấy Huyết Quỷ Thuật A-Z','Kéo Leviathan về Hydra','Kéo Leviathan về Tiki'],'Level':['Level 1-700','Level 700-Sea 3','Sea 3-Max Level Bao God Human'],'Combo Tộc V4':['Combo 3 Tộc V4 Full Gear','Combo 4 Tộc V4 Full Gear','Combo 5 Tộc V4 Full Gear','Combo 6 Tộc V4 Full Gear','Lấy tộc Quỷ (bao V2-V3)','Lấy tộc Cyborg (bao V2-V3)','Pull Lever'],'Tộc Draco':['Lấy Tộc Rồng A-Z Full Gear'],'Kiếm / Súng / Phụ kiện':['Lấy CDK A-Z','Lấy Tam Kiếm A-Z','Lấy Skull Guitar A-Z','Lấy Lưỡi Hái Bóng Tối','Lấy Tushita','Lấy Yama','Lấy Mini Yoru','Lấy Mỏ Neo Cá Mập','Lấy Fox Lamp'],'Beli & Frag':['50M Beli','500M Beli','1 Tỷ Beli','15.000 Fragment']};
function render(){serviceGrid.innerHTML=Object.entries(catalog).map(([k,v])=>'<article class="card"><div style="font-size:42px">'+(k==='Leviathan'?'🌊':k==='Level'?'📈':k==='Combo Tộc V4'?'👹':k==='Tộc Draco'?'🐉':k==='Beli & Frag'?'💰':'⚔️')+'</div><h3>'+k+'</h3><span class="status">Sẵn sàng</span><p>'+v.length+' gói dịch vụ</p><button class="btn dark full" onclick="alert(\''+k+': '+v.join(' | ')+\')">XEM GÓI →</button></article>').join('')}
function openAuth(){authModal.classList.add('show')}function closeAuth(){authModal.classList.remove('show')}render();
</script></body></html>
